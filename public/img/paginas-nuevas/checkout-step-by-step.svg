<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="640" x2="1200" y2="640" />
    <line x1="240" y1="0" x2="240" y2="800" />
    <line x1="480" y1="0" x2="480" y2="800" />
    <line x1="720" y1="0" x2="720" y2="800" />
    <line x1="960" y1="0" x2="960" y2="800" />
  </g>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#090d16" />
  <text x="60" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="1">IESA</text>
  <text x="120" y="43" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">| Checkout Seguro de Admisiones</text>
  <rect x="1020" y="20" width="120" height="30" rx="8" fill="#1e293b" />
  <text x="1042" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🔒 SSL 256-Bit</text>

  <!-- Central Card -->
  <rect x="180" y="110" width="840" height="630" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 25px 35px rgba(0,0,0,0.5))" />

  <!-- Step Wizard Bar -->
  <g transform="translate(240, 150)">
    <!-- Line connector -->
    <line x1="60" y1="25" x2="660" y2="25" stroke="#334155" stroke-width="3" />
    <line x1="60" y1="25" x2="360" y2="25" stroke="#4f46e5" stroke-width="3" />

    <!-- Step 1: Completed -->
    <circle cx="60" cy="25" r="18" fill="#4f46e5" stroke="#818cf8" stroke-width="2" />
    <text x="60" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✓</text>
    <text x="60" y="62" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Datos Personales</text>

    <!-- Step 2: Active -->
    <circle cx="360" cy="25" r="18" fill="#06b6d4" stroke="#67e8f9" stroke-width="3" />
    <text x="360" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    <text x="360" y="62" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. Programa &amp; Cuotas</text>

    <!-- Step 3: Pending -->
    <circle cx="660" cy="25" r="18" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="660" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3</text>
    <text x="660" y="62" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. Pago &amp; Confirmación</text>
  </g>

  <!-- Step Content -->
  <g transform="translate(240, 260)">
    <text x="0" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Selección del Plan de Pago y Matrícula</text>
    <text x="0" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Paso guiado para agilizar la postulación sin fricción ni recargas de página.</text>

    <!-- Option 1 Card -->
    <rect x="0" y="70" width="340" height="180" rx="16" fill="#0f172a" stroke="#4f46e5" stroke-width="2" />
    <rect x="20" y="90" width="70" height="22" rx="6" fill="#4338ca" />
    <text x="30" y="105" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">RECOMENDADO</text>
    <text x="20" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Pago Único Anticipado</text>
    <text x="20" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="900">10% Descuento</text>
    <text x="20" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Acceso inmediato a la inducción y materiales.</text>
    <circle cx="310" cy="95" r="10" fill="#4f46e5" />
    <circle cx="310" cy="95" r="4" fill="#ffffff" />

    <!-- Option 2 Card -->
    <rect x="370" y="70" width="340" height="180" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="390" y="90" width="75" height="22" rx="6" fill="#334155" />
    <text x="400" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">FINANCIAMIENTO</text>
    <text x="390" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Plan Trimestral en Cuotas</text>
    <text x="390" y="165" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="22" font-weight="900">3 Cuotas Flexibles</text>
    <text x="390" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Sin intereses de apertura académica.</text>
    <circle cx="680" cy="95" r="10" fill="#1e293b" stroke="#475569" stroke-width="2" />

    <!-- Summary Box -->
    <rect x="0" y="275" width="710" height="75" rx="14" fill="#090d16" stroke="#1e293b" />
    <text x="20" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Programa Seleccionado:</text>
    <text x="20" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Maestría en Administración (MBA IESA) — Cohorte 2027</text>
    <text x="560" y="325" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">✓ Verificado</text>

    <!-- Buttons -->
    <rect x="0" y="380" width="130" height="48" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="40" y="410" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">← Atrás</text>

    <rect x="530" y="380" width="180" height="48" rx="12" fill="url(#btnGrad)" />
    <text x="560" y="410" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Continuar al Pago →</text>
  </g>

  <!-- Tag overlay -->
  <rect x="470" y="750" width="260" height="32" rx="16" fill="#4338ca" />
  <text x="600" y="771" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PROYECTO EN DESARROLLO (UX/UI)</text>
</svg>
